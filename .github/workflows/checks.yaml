name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install static workflow and shell analyzers
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0
      - name: Install checksum-verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --dir "$RUNNER_TEMP/actionlint" \
            --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --pattern '*checksums.txt'
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing ./*checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate workflows and scripts
        run: |
          actionlint
          shellcheck -x --source-path=SCRIPTDIR scripts/* tests/*.sh .github/scripts/*.sh
          for file in scripts/* tests/*.sh .github/scripts/*.sh; do bash -n "$file"; done
      - name: Exercise release detection and registry failures
        run: |
          tests/resolve-build.sh
          tests/prepare-source.sh
      - name: Read pinned upstream revision
        id: upstream
        run: |
          source config/source.env
          echo "commit=$PINNED_POMERIUM_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream for connection regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pomerium/pomerium
          ref: ${{ steps.upstream.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Verify backported connection cleanup
        run: |
          scripts/prepare-source upstream '${{ steps.upstream.outputs.commit }}'
          docker run --rm --network none -v "$PWD:/work:ro" -w /work \
            -e GOCACHE=/tmp/go-cache -e GOTOOLCHAIN=local \
            golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea \
            bash tests/admin-connections.sh /work/upstream
      - name: Test structured source resolution
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work/tools \
            -e GOCACHE=/tmp/go-cache -e GOTOOLCHAIN=local \
            golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea \
            go test ./sourceplan
      - name: Exercise registry backoff
        run: bash .github/scripts/test-oci-retry.sh
