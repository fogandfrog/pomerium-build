name: Build Envoy
on:
  workflow_call:
    inputs:
      pomerium_commit:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.envoy.outputs.image }}
      commit:
        value: ${{ jobs.envoy.outputs.commit }}
      timestamp:
        value: ${{ jobs.envoy.outputs.timestamp }}
permissions:
  contents: read
  packages: write
jobs:
  envoy:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      image: ${{ steps.publish.outputs.image }}
      commit: ${{ steps.plan.outputs.commit }}
      timestamp: ${{ steps.source.outputs.timestamp }}
    env:
      GO_IMAGE: golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
      IMAGE: ghcr.io/fogandfrog/pomerium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pomerium/pomerium
          ref: ${{ inputs.pomerium_commit }}
          path: upstream
          persist-credentials: false
      - name: Resolve the selected Go module and verified source origin
        id: plan
        run: |
          set -euo pipefail
          mkdir reports
          cmp LICENSE upstream/LICENSE
          docker run --rm -v "$PWD:/work:ro" -w /work/tools \
            -e GOCACHE=/tmp/go-cache -e GOMODCACHE=/tmp/go-mod -e GOTOOLCHAIN=local \
            "$GO_IMAGE" go run ./sourceplan module /work/upstream > reports/envoy-module.json
          commit=$(jq -er .commit reports/envoy-module.json)
          [[ $commit =~ ^[a-f0-9]{40}$ ]]
          source config/source.env
          tag="envoy-$commit-build.$ENVOY_BUILD_REVISION"
          printf 'commit=%s\ntag=%s\n' "$commit" "$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout the exact custom Envoy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pomerium/envoy-custom
          ref: ${{ steps.plan.outputs.commit }}
          path: envoy-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source license and record its timestamp
        id: source
        run: |
          cmp config/envoy-LICENSE envoy-source/LICENSE
          test "$(git -C envoy-source rev-parse HEAD)" = '${{ steps.plan.outputs.commit }}'
          timestamp=$(git -C envoy-source show -s --format=%ct HEAD)
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          mkdir -p envoy-source/independent-build
          cp config/envoy-upstream-LICENSE envoy-source/independent-build/ENVOY-LICENSE
          docker run --rm --network none -v "$PWD:/work:ro" \
            -v "$PWD/envoy-source/independent-build:/output" -w /work/tools \
            -e GOCACHE=/tmp/go-cache -e GOTOOLCHAIN=local "$GO_IMAGE" \
            go build -o /output/sourceplan ./sourceplan
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check for an already published immutable Envoy build
        id: cache
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if info=$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found|NAME_UNKNOWN|MANIFEST_UNKNOWN' <<< "$info"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$info" >&2; exit 1
          fi
      - name: Audit source dependencies
        if: steps.cache.outputs.exists != 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: trivy@0.71.0
      - name: Enable registry backoff
        if: steps.cache.outputs.exists != 'true'
        uses: ./.github/actions/trivy-retry
      - name: Scan source before build execution
        if: steps.cache.outputs.exists != 'true'
        run: trivy fs --scanners vuln --severity CRITICAL --exit-code 1 --ignorefile /dev/null envoy-source
      - name: Reclaim the disposable runner's unused tool cache
        if: steps.cache.outputs.exists != 'true'
        run: scripts/free-build-space
      - name: Compile custom Envoy from source with an Apache license stamp
        if: steps.cache.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: envoy-source
          file: Dockerfile.envoy
          platforms: linux/amd64
          load: true
          provenance: false
          tags: envoy-build:scan
          labels: |
            org.opencontainers.image.source=https://github.com/fogandfrog/pomerium-build
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.plan.outputs.commit }}
      - name: Verify evaluated Envoy dependency and retain source notices
        if: steps.cache.outputs.exists != 'true'
        run: |
          set -euo pipefail
          id=$(docker create envoy-build:scan /envoy)
          mkdir -p .cache
          docker cp "$id:/envoy" .cache/envoy
          docker cp "$id:/envoy-query.xml" reports/envoy-query.xml
          docker cp "$id:/version.txt" reports/envoy-version.txt
          docker rm "$id"
          docker run --rm --network none -v "$PWD:/work:ro" -w /work/tools \
            -e GOCACHE=/tmp/go-cache -e GOTOOLCHAIN=local -i "$GO_IMAGE" \
            go run ./sourceplan bazel < reports/envoy-query.xml > reports/envoy-upstream.json
          docker run --rm --network none -v "$PWD:/work:ro" -w /work/tools \
            -e GOCACHE=/tmp/go-cache -e GOTOOLCHAIN=local "$GO_IMAGE" \
            go run ./sourceplan license /work/.cache/envoy > reports/envoy-license.json
          cat reports/envoy-module.json reports/envoy-upstream.json >> "$GITHUB_STEP_SUMMARY"
      - name: Scan Envoy distribution
        if: steps.cache.outputs.exists != 'true'
        run: trivy image --image-src docker --scanners vuln --ignorefile /dev/null --severity CRITICAL --exit-code 1 envoy-build:scan
      - name: Login to GHCR after building
        if: steps.cache.outputs.exists != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish or reuse exact Envoy image digest
        id: publish
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          CACHED: ${{ steps.cache.outputs.exists }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ $CACHED != true ]]; then
            docker tag envoy-build:scan "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          # Check metadata on cache reuse too; never accept an unrelated tagged image.
          docker pull "$IMAGE@$digest"
          test "$(docker inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          test "$(docker inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = Apache-2.0
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Envoy: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source resolution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: envoy-build-evidence
          path: reports/
